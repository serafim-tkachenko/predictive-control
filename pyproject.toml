[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "predictive-control"
version = "0.1.0"
description = "Controlled experiments on predictive representations and reinforcement learning"
requires-python = ">=3.11"
dependencies = ["stable-baselines3==2.9.0", "minigrid==3.1.0", "gymnasium==1.3.0", "numpy==2.4.6"]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "ruff==0.16.8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
