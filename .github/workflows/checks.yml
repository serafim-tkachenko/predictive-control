name: checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements-cpu.txt --extra-index-url https://download.pytorch.org/whl/cpu
      - run: pip install --no-deps -e .
      - run: ruff check . && ruff format --check . && pytest -q
      - run: python -m predictive_control.train --steps 1024 --eval-episodes 2 --output runs/ci
      - run: python -m predictive_control.train_crossing --steps 1024 --output runs/ci-crossing
